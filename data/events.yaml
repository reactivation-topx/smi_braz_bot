# Календарь событий Бразилии для «СМИ Бот».
#
# Как добавить событие — скопируйте блок и поменяйте поля:
#   id          уникальный латинский идентификатор
#   name_ru     название по-русски (идёт в карточку)
#   name_pt     оригинальное название
#   category    holiday | state_holiday | festival | sport | commercial | culture
#   scope       BR (вся страна) или список штатов: [SP, RJ]
#   importance  1 — региональное, 2 — заметное, 3 — главное
#   about       что это (1–2 предложения)
#   tip         подсказка менеджерам (если пусто — общая по категории)
#   place       город/площадка (необязательно)
# Дата задаётся одним из правил:
#   fixed: "MM-DD"                      каждый год
#   date: "YYYY-MM-DD" (+ end: ...)     разово
#   easter: N                           N дней от Пасхи
#   nth_weekday: {month, weekday (0=пн..6=вс), n (-1 = последний)}
#   offset: N                           сдвиг после вычисления
#   duration: N                         длительность в днях
#
# Даты разовых событий проверены по открытым источникам на 05.11.2026.
# Праздники штатов — справочно, перед важными акциями лучше сверить.

# ─────────────────────────── Федеральные праздники ───────────────────────────

- id: ano_novo
  name_ru: Новый год
  name_pt: Confraternização Universal
  category: holiday
  scope: BR
  importance: 3
  fixed: "01-01"
  about: Государственный выходной. Вместе с Рождеством — сезон отпусков и поездок к морю.
  tip: Клиенты на каникулах и в разъездах — лучше заранее поздравить и не перегружать сообщениями 1 января.

- id: carnaval
  name_ru: Карнавал
  name_pt: Carnaval
  category: festival
  scope: BR
  importance: 3
  easter: -51          # пятница перед Пепельной средой
  duration: 6          # пт → ср (Quarta-feira de Cinzas)
  about: Главный праздник страны. Пн и вт — официально «ponto facultativo», но фактически почти вся Бразилия не работает с пятницы до обеда среды. Крупнейшие гуляния — Рио, Салвадор, Ресифи/Олинда, Сан-Паулу.
  tip: Самая длинная «пауза» года. Готовьте карнавальные акции и поздравления заранее — за неделю внимание уже уходит в праздник.

- id: sexta_santa
  name_ru: Страстная пятница
  name_pt: Sexta-feira Santa (Paixão de Cristo)
  category: holiday
  scope: BR
  importance: 2
  easter: -2
  about: Государственный выходной перед Пасхой, начало длинных выходных.

- id: pascoa
  name_ru: Пасха
  name_pt: Páscoa
  category: commercial
  scope: BR
  importance: 2
  easter: 0
  about: Католическая Пасха. Большой коммерческий сезон — шоколадные яйца, семейные обеды.
  tip: Хороший повод для тёплого поздравления; длинные выходные с пятницы.

- id: tiradentes
  name_ru: День Тирадентиса
  name_pt: Tiradentes
  category: holiday
  scope: BR
  importance: 2
  fixed: "04-21"
  about: Государственный выходной в память героя борьбы за независимость. В Минас-Жерайсе это «Data Magna» штата, в Бразилиа ещё и день основания столицы.

- id: dia_trabalho
